<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Acc & Repair - Official Store</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            padding: 25px 15px;
            border-bottom: 3px solid #ff4d4d;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff4d4d;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tagline {
            color: #b3b3b3;
            font-size: 13px;
            margin: 6px 0 0;
        }
        .container {
            padding: 20px 10px;
            max-width: 700px;
            margin: auto;
        }
        .section-title {
            text-align: left;
            font-size: 18px;
            color: #fff;
            margin: 25px 0 15px;
            border-left: 4px solid #ff4d4d;
            padding-left: 10px;
            font-weight: bold;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .product-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #252525;
        }
        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin: 8px 0;
            color: #fff;
        }
        .price {
            color: #ff4d4d;
            font-size: 20px;
            font-weight: bold;
            margin: 8px 0;
        }
        .note {
            font-size: 11px;
            color: #999;
            display: block;
            margin-top: 2px;
        }
        .desc {
            font-size: 13px;
            color: #ccc;
            margin: 10px 0 15px;
            line-height: 1.5;
            text-align: left;
            padding: 0 5px;
        }
